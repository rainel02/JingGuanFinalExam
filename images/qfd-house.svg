<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <style>
    text { font-family: 'SimSun', 'Microsoft YaHei', sans-serif; font-size: 10px; fill: #333; }
    .bold { font-weight: 700; }
    .roof { fill: #E0E7FF; stroke: #4F46E5; stroke-width: 1; }
    .wall { fill: #F0F4FF; stroke: #4F46E5; stroke-width: 1; }
    .matrix { fill: #FFF; stroke: #4F46E5; stroke-width: 1; }
    .tri { fill: #FEE2E2; stroke: #EF4444; stroke-width: 1; }
    .section { font-weight: 600; font-size: 11px; }
  </style>
  <text x="160" y="12" text-anchor="middle" class="bold" font-size="13">质量屋 (House of Quality)</text>
  <!-- Left: Customer Requirements (A) -->
  <rect x="10" y="25" width="75" height="140" class="wall"/>
  <text x="47" y="40" text-anchor="middle" class="section">A</text>
  <text x="47" y="55" text-anchor="middle">顾客需求</text>
  <line x1="10" y1="65" x2="85" y2="65" stroke="#4F46E5" stroke-width="0.5"/>
  <text x="15" y="80">需求1</text>
  <text x="15" y="95">需求2</text>
  <text x="15" y="110">需求3</text>
  <text x="15" y="125">需求4</text>
  <!-- Center: Relationship Matrix (B) -->
  <rect x="85" y="25" width="100" height="140" class="matrix"/>
  <text x="135" y="40" text-anchor="middle" class="section">B</text>
  <text x="135" y="55" text-anchor="middle">关系矩阵</text>
  <!-- Right: Competitive Assessment (G) -->
  <rect x="185" y="25" width="70" height="140" class="wall"/>
  <text x="220" y="40" text-anchor="middle" class="section">G</text>
  <text x="220" y="55" text-anchor="middle">竞争评价</text>
  <!-- Top: Technical Requirements (C) -->
  <rect x="85" y="165" width="100" height="35" class="wall" transform="rotate(-90, 135, 182)"/>
  <!-- Simplified: show C and D above the matrix -->
  <rect x="85" y="185" width="50" height="30" class="wall"/>
  <text x="110" y="200" text-anchor="middle" class="section">C</text>
  <text x="110" y="212" text-anchor="middle">技术需求</text>
  <rect x="135" y="185" width="50" height="30" class="wall"/>
  <text x="160" y="200" text-anchor="middle" class="section">D</text>
  <text x="160" y="212" text-anchor="middle">计划目标</text>
  <!-- Roof: Correlation Matrix (E) -->
  <polygon points="85,25 185,25 185,0 160,0 135,25" class="tri"/>
  <text x="130" y="18" text-anchor="middle" font-size="9">E 相关矩阵</text>
  <!-- Bottom section labels -->
  <rect x="260" y="25" width="50" height="35" class="wall"/>
  <text x="285" y="40" text-anchor="middle" class="section">F</text>
  <text x="285" y="52" text-anchor="middle">重要度</text>
  <!-- Connection arrow -->
  <path d="M 85 165 L 10 165" stroke="#4F46E5" stroke-width="0.5" fill="none" stroke-dasharray="4"/>
</svg>
