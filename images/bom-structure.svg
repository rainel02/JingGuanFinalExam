<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220">
  <style>
    text { font-family: 'SimSun', 'Microsoft YaHei', sans-serif; font-size: 11px; fill: #333; }
    .box { fill: #E0E7FF; stroke: #4F46E5; stroke-width: 1.5; rx: 6; }
    .box-main { fill: #4F46E5; stroke: #3730A3; stroke-width: 1.5; rx: 6; }
    .line { stroke: #4F46E5; stroke-width: 1.5; }
    .white { fill: white; }
    .bold { font-weight: 600; }
  </style>
  <text x="250" y="15" text-anchor="middle" class="bold" font-size="13">BOM 结构</text>
  <!-- Product P -->
  <rect x="210" y="25" width="80" height="36" class="box-main"/>
  <text x="250" y="42" text-anchor="middle" class="white" font-weight="bold">产品P</text>
  <text x="250" y="56" text-anchor="middle" class="white" font-size="10">(1,3)</text>
  <!-- Lines to sub-components -->
  <line x1="235" y1="61" x2="130" y2="95" class="line"/>
  <line x1="265" y1="61" x2="370" y2="95" class="line"/>
  <!-- COM_A -->
  <rect x="80" y="95" width="100" height="36" class="box"/>
  <text x="130" y="112" text-anchor="middle" font-weight="bold">COM_A</text>
  <text x="130" y="126" text-anchor="middle" font-size="10">(2,1)</text>
  <!-- COM_B -->
  <rect x="320" y="95" width="100" height="36" class="box"/>
  <text x="370" y="112" text-anchor="middle" font-weight="bold">COM_B</text>
  <text x="370" y="126" text-anchor="middle" font-size="10">(1,4)</text>
  <!-- Lines to parts -->
  <line x1="100" y1="131" x2="50" y2="165" class="line"/>
  <line x1="110" y1="131" x2="100" y2="165" class="line"/>
  <line x1="145" y1="131" x2="150" y2="165" class="line"/>
  <line x1="345" y1="131" x2="310" y2="165" class="line"/>
  <line x1="395" y1="131" x2="420" y2="165" class="line"/>
  <!-- A1, A2, A3 -->
  <rect x="20" y="165" width="60" height="36" class="box"/>
  <text x="50" y="182" text-anchor="middle" font-weight="bold">A1</text>
  <text x="50" y="196" text-anchor="middle" font-size="10">(3,2)</text>
  <rect x="70" y="165" width="60" height="36" class="box"/>
  <text x="100" y="182" text-anchor="middle" font-weight="bold">A2</text>
  <text x="100" y="196" text-anchor="middle" font-size="10">(2,1)</text>
  <rect x="120" y="165" width="60" height="36" class="box"/>
  <text x="150" y="182" text-anchor="middle" font-weight="bold">A3</text>
  <text x="150" y="196" text-anchor="middle" font-size="10">(2,1)</text>
  <!-- B1, B2 -->
  <rect x="280" y="165" width="60" height="36" class="box"/>
  <text x="310" y="182" text-anchor="middle" font-weight="bold">B1</text>
  <text x="310" y="196" text-anchor="middle" font-size="10">(5,2)</text>
  <rect x="390" y="165" width="60" height="36" class="box"/>
  <text x="420" y="182" text-anchor="middle" font-weight="bold">B2</text>
  <text x="420" y="196" text-anchor="middle" font-size="10">(2,2)</text>
  <!-- Legend -->
  <text x="250" y="215" text-anchor="middle" font-size="10" fill="#666">格式: (数量, 提前期) — 如COM_A(2,1)表示需2个、提前1天</text>
</svg>
